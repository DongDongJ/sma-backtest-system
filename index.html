<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMA 雙均線回測系統</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="chartTooltip" class="tooltip"></div>
    
    <div class="container">
        <div class="header">
            <h1>📊 八方來財&MA回策系統</h1>
            <p>✨ 宗旨利滾利小應好運八方來</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('single')">單一策略回測</button>
            <button class="tab" onclick="switchTab('optimize')">參數優化模式</button>
        </div>

        <div class="content">
            <!-- 單一策略回測 -->
            <div id="single" class="tab-content active">
                <h2>🎯 單一策略回測</h2>
                <div class="info-box">
                    輸入短期與長期均線天數，系統將針對黃金交叉(買入)與死亡交叉(賣出)的回測結果。
                </div>

                <div class="form-group">
                    <label>📁 上傳 CSV 檔案</label>
                    <div class="file-upload" onclick="document.getElementById('csvFile1').click()">
                        <input type="file" id="csvFile1" accept=".csv" style="display:none" onchange="handleFileUpload(1)">
                        <p id="fileName1">點擊上傳或拖放 CSV 檔案</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>選擇股票代碼</label>
                    <select id="stockSelect1">
                        <option value="">請先上傳 CSV 檔案</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>短期均線類型</label>
                        <select id="shortMAType">
                            <option value="SMA">SMA (簡單移動平均)</option>
                            <option value="EMA">EMA (指數移動平均)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>短期均線(天數)</label>
                        <input type="number" id="shortMA" value="5" min="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>長期均線類型</label>
                        <select id="longMAType">
                            <option value="SMA">SMA (簡單移動平均)</option>
                            <option value="EMA">EMA (指數移動平均)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>長期均線(天數)</label>
                        <input type="number" id="longMA" value="20" min="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>開始日期</label>
                        <input type="text" id="startDate1" value="1/1/2024" placeholder="M/D/YYYY">
                    </div>
                    <div class="form-group">
                        <label>結束日期</label>
                        <input type="text" id="endDate1" value="12/31/2024" placeholder="M/D/YYYY">
                    </div>
                </div>

                <div class="form-group">
                    <label>初始資金 ($)</label>
                    <input type="number" id="initialCash1" value="10000" min="1">
                </div>

                <button class="btn" onclick="runSingleBacktest()">開始回測</button>

                <div class="error" id="error1"></div>
                <div class="loading" id="loading1">
                    <div class="spinner"></div>
                    <p>正在計算中...</p>
                </div>
                <div class="results" id="results1"></div>
            </div>

            <!-- 參數優化模式 -->
            <div id="optimize" class="tab-content">
                <h2>⚙️ 參數優化模式</h2>
                <div class="info-box">
                    系統將測試所有可能的均線組合,找出最佳策略參數。
                </div>

                <div class="form-group">
                    <label>📁 上傳 CSV 檔案</label>
                    <div class="file-upload" onclick="document.getElementById('csvFile2').click()">
                        <input type="file" id="csvFile2" accept=".csv" style="display:none" onchange="handleFileUpload(2)">
                        <p id="fileName2">點擊上傳或拖放 CSV 檔案</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>選擇股票代碼</label>
                    <select id="stockSelect2">
                        <option value="">請先上傳 CSV 檔案</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>均線類型</label>
                    <select id="maType">
                        <option value="SMA">SMA (簡單移動平均)</option>
                        <option value="EMA">EMA (指數移動平均)</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>最小均線天數</label>
                        <input type="number" id="minMA" value="1" min="1">
                    </div>
                    <div class="form-group">
                        <label>最大均線天數</label>
                        <input type="number" id="maxMA" value="256" min="1">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>開始日期</label>
                        <input type="text" id="startDate2" value="1/1/2024" placeholder="M/D/YYYY">
                    </div>
                    <div class="form-group">
                        <label>結束日期</label>
                        <input type="text" id="endDate2" value="12/31/2024" placeholder="M/D/YYYY">
                    </div>
                </div>

                <div class="form-group">
                    <label>初始資金 ($)</label>
                    <input type="number" id="initialCash2" value="10000" min="1">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>顯示結果數量</label>
                        <select id="displayCount">
                            <option value="10">前 10 名</option>
                            <option value="20">前 20 名</option>
                            <option value="30" selected>前 30 名</option>
                            <option value="50">前 50 名</option>
                            <option value="100">前 100 名</option>
                            <option value="custom">自訂數量</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>自訂數量(選擇自訂時)</label>
                        <input type="number" id="customCount" value="30" min="1" disabled>
                    </div>
                </div>

                <button class="btn" onclick="runOptimization()">開始優化</button>

                <div class="error" id="error2"></div>
                <div class="loading" id="loading2">
                    <div class="spinner"></div>
                    <p>正在測試所有參數組合...</p>
                </div>
                <div class="results" id="results2"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
